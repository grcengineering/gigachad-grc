# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# SECURITY NOTE: security_opt is inherited from docker-compose.yml base file.
# These overrides only add development-specific configurations.

services:
  # Development mode for services with hot reload
  controls:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service-dev
      args:
        SERVICE: controls
    volumes:
      - ./services/controls/src:/app/services/controls/src
      - ./services/shared/src:/app/services/shared/src
      - /app/node_modules
    environment:
      NODE_ENV: development

  frameworks:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service-dev
      args:
        SERVICE: frameworks
    volumes:
      - ./services/frameworks/src:/app/services/frameworks/src
      - ./services/shared/src:/app/services/shared/src
      - /app/node_modules
    environment:
      NODE_ENV: development

  policies:
