      - /app/node_modules
    environment:
      NODE_ENV: development

  audit:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service-dev
      args:
        SERVICE: audit
    volumes:
      - ./services/audit/src:/app/services/audit/src
      - ./services/shared/src:/app/services/shared/src
      - /app/node_modules
