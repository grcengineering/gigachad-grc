{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gigachad-grc.fullname" . }}-keycloak-realm
  labels:
    {{- include "gigachad-grc.labels" . | nindent 4 }}
data:
  {{ .Values.keycloak.realm }}-realm.json: |-
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "displayName": "GigaChad GRC",
      "enabled": true,
      "sslRequired": "{{ if .Values.ingress.tls.enabled }}external{{ else }}none{{ end }}",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "resetPasswordAllowed": true,
      "bruteForceProtected": true,
      "failureFactor": 5,
      "passwordPolicy": "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername and passwordHistory(5)",
      "roles": {
        "realm": [
          { "name": "admin", "description": "Full platform access" },
          { "name": "compliance_manager", "description": "Manage GRC program data" },
          { "name": "auditor", "description": "Audit and export access" },
          { "name": "viewer", "description": "Read-only platform access" }
        ]
      },
      "groups": [
        { "name": "Administrators", "realmRoles": ["admin"] },
        { "name": "Compliance Team", "realmRoles": ["compliance_manager"] },
        { "name": "Auditors", "realmRoles": ["auditor"] },
        { "name": "Viewers", "realmRoles": ["viewer"] }
      ],
      "defaultRoles": ["viewer"],
      "clients": [
        {
          "clientId": "grc-frontend",
          "name": "GRC Frontend Application",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "protocol": "openid-connect",
          "redirectUris": [
            {{- if .Values.ingress.enabled }}
            "{{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}/*",
            {{- end }}
            "http://localhost:3000/*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "+"
          },
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "multivalued": "true",
                "userinfo.token.claim": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "roles",
                "jsonType.label": "String"
              }
            },
            {
              "name": "organization-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "organization_id",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "organization_id",
                "jsonType.label": "String"
              }
            }
          ]
        },
        {
          "clientId": "grc-services",
          "name": "GRC Backend Services",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "secret": "${GRC_SERVICES_SECRET}"
        }
      ],
      "users": [
        {
          "username": "service-account-grc-services",
          "enabled": true,
          "serviceAccountClientId": "grc-services",
          "clientRoles": {
            "realm-management": ["manage-users", "view-users"]
          }
        }
      ]
    }
{{- end }}
