{{- $secretName := include "gigachad-grc.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existingSecret -}}
{{- $existingData = $existingSecret.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "gigachad-grc.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgresql.enabled }}
  postgresql-password: {{ required "postgresql.auth.password is required -- set via --set postgresql.auth.password=<value>" (dig "auth" "password" "" .Values.postgresql) | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalDatabase.url }}
  database-url: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- else if .Values.postgresql.enabled }}
  database-url: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.auth.username (required "postgresql.auth.password is required" (dig "auth" "password" "" .Values.postgresql)) (include "gigachad-grc.postgresql.host" .) .Values.postgresql.auth.database | b64enc | quote }} # gitleaks:allow -- chart reads a user-supplied value
  {{- else }}
  {{- fail "externalDatabase.url is required when postgresql.enabled=false" }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ required "redis.auth.password is required -- set via --set redis.auth.password=<value>" (dig "auth" "password" "" .Values.redis) | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalRedis.url }}
  redis-url: {{ .Values.externalRedis.url | b64enc | quote }}
  {{- else if .Values.redis.enabled }}
  redis-url: {{ printf "redis://:%s@%s:6379" (required "redis.auth.password is required" (dig "auth" "password" "" .Values.redis)) (include "gigachad-grc.redis.host" .) | b64enc | quote }} # gitleaks:allow -- chart reads a user-supplied value
  {{- else }}
  {{- fail "externalRedis.url is required when redis.enabled=false" }}
  {{- end }}
  {{- if .Values.rustfs.enabled }}
  s3-access-key: {{ .Values.rustfs.auth.rootUser | b64enc | quote }}
  s3-secret-key: {{ required "rustfs.auth.rootPassword is required -- set via --set rustfs.auth.rootPassword=<value>" (dig "auth" "rootPassword" "" .Values.rustfs) | b64enc | quote }}
  {{- else }}
  s3-access-key: {{ required "externalS3.accessKey is required when rustfs.enabled=false" .Values.externalS3.accessKey | b64enc | quote }}
  s3-secret-key: {{ required "externalS3.secretKey is required when rustfs.enabled=false" .Values.externalS3.secretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.keycloak.enabled }}
  keycloak-admin-password: {{ required "keycloak.auth.adminPassword is required -- set via --set keycloak.auth.adminPassword=<value>" (dig "auth" "adminPassword" "" .Values.keycloak) | b64enc | quote }}
  {{- end }}
  {{- $encryptionKey := dig "env" "encryptionKey" "" .Values.controls }}
  encryption-key: {{ if $encryptionKey }}{{ $encryptionKey | b64enc | quote }}{{ else if hasKey $existingData "encryption-key" }}{{ index $existingData "encryption-key" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  {{- $jwtSecret := dig "env" "jwtSecret" "" .Values.controls }}
  jwt-secret: {{ if $jwtSecret }}{{ $jwtSecret | b64enc | quote }}{{ else if hasKey $existingData "jwt-secret" }}{{ index $existingData "jwt-secret" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  {{- $sessionSecret := dig "env" "sessionSecret" "" .Values.controls }}
  session-secret: {{ if $sessionSecret }}{{ $sessionSecret | b64enc | quote }}{{ else if hasKey $existingData "session-secret" }}{{ index $existingData "session-secret" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  {{- $phishingSecret := dig "env" "phishingTrackingSecret" "" .Values.controls }}
  phishing-tracking-secret: {{ if $phishingSecret }}{{ $phishingSecret | b64enc | quote }}{{ else if hasKey $existingData "phishing-tracking-secret" }}{{ index $existingData "phishing-tracking-secret" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
  {{- $keycloakClientSecret := dig "env" "keycloakAdminClientSecret" "" .Values.controls }}
  keycloak-services-client-secret: {{ if $keycloakClientSecret }}{{ $keycloakClientSecret | b64enc | quote }}{{ else if hasKey $existingData "keycloak-services-client-secret" }}{{ index $existingData "keycloak-services-client-secret" | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
  {{- if .Values.grafana.enabled }}
  grafana-admin-password: {{ required "grafana.auth.adminPassword is required -- set via --set grafana.auth.adminPassword=<value>" (dig "auth" "adminPassword" "" .Values.grafana) | b64enc | quote }}
  {{- end }}
