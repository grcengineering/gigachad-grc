{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gigachad-grc.fullname" . }}-postgresql-init
  labels:
    {{- include "gigachad-grc.labels" . | nindent 4 }}
data:
  01-create-keycloak-database.sh: |-
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'EOSQL'
    SELECT 'CREATE DATABASE "{{ .Values.postgresql.auth.keycloakDatabase }}"'
    WHERE NOT EXISTS (
      SELECT FROM pg_database WHERE datname = '{{ .Values.postgresql.auth.keycloakDatabase }}'
    )\gexec
    EOSQL
{{- end }}
