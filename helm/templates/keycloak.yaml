{{- if .Values.keycloak.enabled }}
{{- if not .Values.postgresql.enabled }}
{{- fail "keycloak.enabled=true currently requires postgresql.enabled=true; disable built-in Keycloak when using an external database/identity provider" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gigachad-grc.fullname" . }}-keycloak
  labels:
    {{- include "gigachad-grc.labels" . | nindent 4 }}
    {{- include "gigachad-grc.selectorLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gigachad-grc.selectorLabels" (dict "context" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gigachad-grc.labels" . | nindent 8 }}
        {{- include "gigachad-grc.selectorLabels" (dict "context" . "component" "keycloak") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gigachad-grc.serviceAccountName" . }}
      initContainers:
        - name: initialize-keycloak-database
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ include "gigachad-grc.imagePullPolicy" .Values.postgresql.image }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h {{ include "gigachad-grc.postgresql.host" . }} -U "$POSTGRES_USER"; do sleep 2; done
              if ! psql -h {{ include "gigachad-grc.postgresql.host" . }} -U "$POSTGRES_USER" -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname='{{ .Values.postgresql.auth.keycloakDatabase }}'" | grep -q 1; then
                createdb -h {{ include "gigachad-grc.postgresql.host" . }} -U "$POSTGRES_USER" \
                  {{ .Values.postgresql.auth.keycloakDatabase | quote }}
              fi
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gigachad-grc.secretName" . }}
                  key: postgresql-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ include "gigachad-grc.imagePullPolicy" .Values.keycloak.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            {{- if eq .Values.keycloak.mode "production" }}
            - start
            {{- else }}
            - start-dev
            {{- end }}
            - --import-realm
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://{{ include "gigachad-grc.postgresql.host" . }}:5432/{{ .Values.postgresql.auth.keycloakDatabase }}"
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gigachad-grc.secretName" . }}
                  key: postgresql-password
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            {{- if eq .Values.keycloak.mode "production" }}
            - name: KC_HOSTNAME
              value: {{ required "keycloak.hostname is required when keycloak.mode=production" .Values.keycloak.hostname | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            {{- else }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            {{- end }}
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.auth.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gigachad-grc.secretName" . }}
                  key: keycloak-admin-password
            - name: GRC_SERVICES_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gigachad-grc.secretName" . }}
                  key: keycloak-services-client-secret
          readinessProbe:
            httpGet:
              path: /auth/realms/master
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /auth/realms/master
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: {{ include "gigachad-grc.fullname" . }}-keycloak-realm
      {{- with .Values.keycloak.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gigachad-grc.fullname" . }}-keycloak
  labels:
    {{- include "gigachad-grc.labels" . | nindent 4 }}
    {{- include "gigachad-grc.selectorLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gigachad-grc.selectorLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
{{- end }}
