# Traefik Static Configuration
api:
  dashboard: false
  insecure: false

log:
  level: INFO
  format: common

accessLog:
  format: common

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    http:
      tls: {}

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: grc-network
    watch: true
  # Enable file provider for dynamic configuration (middlewares)
  file:
    filename: '/etc/traefik/traefik.yml'
    watch: true

# Health check endpoint
ping:
  entryPoint: web

# ===========================================
# TLS - self-signed dev certificate (see scripts/generate-dev-certs.sh)
# ===========================================
tls:
  certificates:
    - certFile: /etc/traefik/certs/dev-localhost.crt
      keyFile: /etc/traefik/certs/dev-localhost.key

# ===========================================
# HTTP Middlewares - Security Hardening
# ===========================================
http:
  middlewares:
    # SECURITY: Rate limiting to prevent DoS and brute force attacks
    # Limits requests to 100/second average with burst capacity of 50
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    # SECURITY: Security headers to protect against common web vulnerabilities
    security-headers:
      headers:
        # Prevent clickjacking by denying iframe embedding
        frameDeny: true
        # Prevent MIME type sniffing attacks
        contentTypeNosniff: true
        # Enable XSS filter in browsers (legacy, but still useful)
        browserXssFilter: true
        # Force HTTPS with HSTS header
        forceSTSHeader: true
        # HSTS max-age: 1 year (31536000 seconds)
        stsSeconds: 31536000
        # Apply HSTS to all subdomains
        stsIncludeSubdomains: true
        # Allow preloading HSTS in browsers
        stsPreload: true
        # Referrer policy for privacy
        referrerPolicy: 'strict-origin-when-cross-origin'
        # Content Security Policy - adjust as needed for your application
        # frame-src/connect-src include https://auth.localhost so keycloak-js
        # (silent SSO check iframe + token requests) isn't blocked by CSP.
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://auth.localhost ws: wss:; frame-src 'self' https://auth.localhost; frame-ancestors 'none'"

    # Combined middleware chain for API endpoints
    api-security:
      chain:
        middlewares:
          - rate-limit
          - security-headers
