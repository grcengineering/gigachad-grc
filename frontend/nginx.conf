server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve Compose service names at request time. Docker assigns a new IP
    # whenever a service container is recreated; static startup resolution
    # leaves nginx pointing at the retired container until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $controls_upstream http://controls:3001;
    set $frameworks_upstream http://frameworks:3002;
    set $policies_upstream http://policies:3004;
    set $tprm_upstream http://tprm:3005;
    set $trust_upstream http://trust:3006;
    set $audit_upstream http://audit:3007;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Tenant organization profile is owned by the controls service. This
    # direct proxy keeps same-origin API access working when the frontend
    # container is exposed without Traefik (for example, CI E2E on :3000).
    location /api/organization {
        proxy_pass $controls_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/frameworks/catalog {
        proxy_pass $controls_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preserve the same service ownership when the frontend is exposed
    # directly for local development or end-to-end testing. Without these
    # routes, every non-controls API request fell through to controls and
    # returned a misleading JSON 404.
    location ~ ^/api/(frameworks|assessments|mappings)(?:/|$) {
        proxy_pass $frameworks_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/policies(?:/|$) {
        proxy_pass $policies_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(vendors|contracts|vendor-assessments|tprm-config)(?:/|$) {
        proxy_pass $tprm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(questionnaires|knowledge-base|trust-center|answer-templates|trust-config)(?:/|$) {
        proxy_pass $trust_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(trust-center/(config|content|public)|knowledge-base/bulk)(?:/|$) {
        proxy_pass $trust_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(audits|audit-requests|audit-portal|findings)(?:/|$) {
        proxy_pass $audit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/audit/(templates|workpapers|test-procedures|remediation|analytics|planning|reports|audit-ai)(?:/|$) {
        proxy_pass $audit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Traefik normally sends service-specific API paths directly to their
    # owning service. If an API path reaches the frontend (or the frontend is
    # exposed directly), send it to controls instead of serving SPA HTML.
    # Nest's JSON 404 is the safe fallback for unknown API paths.
    location ~ ^/api(?:/|$) {
        proxy_pass $controls_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle SPA routing. Deliberately omits the `$uri/` directory-match
    # fallback: the app has a client route at /assets (asset inventory),
    # which collides with Vite's build output directory of the same name -
    # with `$uri/` present, nginx tries to list that real directory (403,
    # autoindex is off) instead of falling through to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}



